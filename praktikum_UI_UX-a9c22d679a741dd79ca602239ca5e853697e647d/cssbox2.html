<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - CSS Box dan Positioning 2 (Gambar 3)</title>
    <link rel="stylesheet" href="css/box2.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <div class="browser-window">
        <!-- Mockup Browser Header sesuai Gambar 3 -->
        <div class="browser-header">
            <div class="browser-title">Moqzilla</div>
            <div class="browser-bar">
                <span class="browser-nav-btn">&#8592; &#8594; &#8635; &#8962;</span>
                <div class="browser-address">http://box1b.com</div>
            </div>
        </div>

        <!-- Layout Sesuai Gambar 3 -->
        <div class="container">
            <!-- Box Hijau Horizontal Atas -->
            <div class="box-green"></div>

            <!-- Bagian Bawah -->
            <div class="content-grid">
                <!-- Kolom Kiri: 2 Kotak Kuning -->
                <div class="col-left">
                    <div class="box-yellow"></div>
                    <div class="box-yellow"></div>
                </div>

                <!-- Kolom Kanan: Kotak Oranye dan Kotak Biru Muda -->
                <div class="col-right">
                    <div class="box-orange"></div>
                    <div class="box-cyan"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tombol Kembali ke Index -->
    <a href="index.html" class="btn-kembali">&#8592; Kembali ke Index</a>
</body>
</html>
