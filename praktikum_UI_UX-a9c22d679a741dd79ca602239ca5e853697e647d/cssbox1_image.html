<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - CSS Box dengan Image (Gambar 2)</title>
    <link rel="stylesheet" href="css/box_image.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <div class="browser-window">
        <!-- Mockup Browser Header sesuai Gambar 2 -->
        <div class="browser-header">
            <div class="browser-bar">
                <span class="browser-nav-btn">&#8592; &#8594; &#8635;</span>
                <div class="browser-address">localhost/praktikum/cssbox01.html</div>
                <span class="browser-icons">&#128269; &#9734;</span>
            </div>
        </div>

        <!-- Konten div diisi dengan 4 gambar sesuai Gambar 2 -->
        <div class="container">
            <div class="box-image">
                <img src="img/bmw1.png" alt="Burung 1">
            </div>
            <div class="box-image">
                <img src="img/bmw2.jpg" alt="Burung 2">
            </div>
            <div class="box-image">
                <img src="img/bmw3.jpg" alt="Burung 3">
            </div>
            <div class="box-image">
                <img src="img/bmw4.jpg" alt="Burung 4">
            </div>
        </div>
    </div>

    <!-- Tombol Kembali ke Index -->
    <a href="index.html" class="btn-kembali">&#8592; Kembali ke Index</a>

</html>
