<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - CSS Box dan Positioning 3 (Gambar 4)</title>
    <link rel="stylesheet" href="css/box3.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <div class="browser-window">
        <!-- Mockup Browser Header sesuai Gambar 4 -->
        <div class="browser-header">
            <div class="browser-title">Moqzilla</div>
            <div class="browser-bar">
                <span class="browser-nav-btn">&#8592; &#8594; &#8635; &#8962;</span>
                <div class="browser-address">http://box2.com</div>
            </div>
        </div>

        <!-- Layout Sesuai Gambar 4 -->
        <div class="container">
            <!-- Baris 1: Kotak Kuning dan Kotak Oranye -->
            <div class="row-top">
                <div class="box-yellow-top"></div>
                <div class="box-orange-top"></div>
            </div>

            <!-- Baris 2: Kotak Hijau, Kotak Abu-abu Besar, Kotak Biru Muda -->
            <div class="row-middle">
                <div class="box-green-mid"></div>
                <div class="box-grey-mid"></div>
                <div class="box-cyan-mid"></div>
            </div>

            <!-- Baris 3: Kotak Biru Tua Memanjang Penuh -->
            <div class="box-blue-bottom"></div>
        </div>
    </div>

    <!-- Tombol Kembali ke Index -->
    <a href="index.html" class="btn-kembali">&#8592; Kembali ke Index</a>
</body>
</html>
